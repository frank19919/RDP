name: RDP Windows via Tailscale
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Activer RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
      - name: Mot de passe
        run: |
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd2024!RDP" -Force)
      - name: Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILKEYSECRET }}
          args: --hostname github-rdp-windows
      - name: Infos et Maintien
        run: |
          $ip = tailscale ip -4
          Write-Host "IP: $ip"
          Write-Host "User: runneradmin"
          Write-Host "Pass: P@ssw0rd2024!RDP"
          Start-Sleep -Seconds 21600
